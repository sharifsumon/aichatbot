# Local: `pnpm infra:up` starts only Postgres and Redis; run the apps with `pnpm dev`.
# VPS:   set the domains in .env, then `docker compose up -d --build`.
#        COMPOSE_PROFILES in .env picks what runs: `app,caddy` on a server of its
#        own, or `app` on a server shared with another site, whose web server
#        then proxies to the *_HOST_PORT ports below (see docs/deploy-vps.md).
#
# No memory is reserved or capped: each service uses only what it needs at the
# moment, and the rest stays free for anything else on the server.
#
# Images: `docker compose pull` downloads the ones GitHub built (Images
# workflow), so a small server never builds; `--build` builds locally instead.

name: agently

x-app-env: &app-env
  env_file: .env
  # If the server runs out of memory, the kernel stops Agently's processes
  # before anything else on the box (another site keeps running).
  oom_score_adj: 500
  environment:
    DATABASE_URL: postgres://agently:${POSTGRES_PASSWORD:-agently}@postgres:5432/agently
    REDIS_URL: redis://redis:6379
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: pgvector/pgvector:pg17
    oom_score_adj: 300
    environment:
      POSTGRES_USER: agently
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agently}
      POSTGRES_DB: agently
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agently"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    oom_score_adj: 300
    # BullMQ needs noeviction so queued jobs are never dropped.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app-env
    profiles: [app]
    image: ${AGENTLY_IMAGES:-ghcr.io/sharifsumon/aichatbot}-tools:${AGENTLY_TAG:-latest}
    build: { context: ., target: tools }
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    restart: "no"

  api:
    <<: *app-env
    profiles: [app]
    image: ${AGENTLY_IMAGES:-ghcr.io/sharifsumon/aichatbot}-api:${AGENTLY_TAG:-latest}
    build: { context: ., target: api }
    # Localhost only: reached through Caddy, or through the shared server's own web server.
    ports: ["127.0.0.1:${API_HOST_PORT:-4000}:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app-env
    profiles: [app]
    image: ${AGENTLY_IMAGES:-ghcr.io/sharifsumon/aichatbot}-worker:${AGENTLY_TAG:-latest}
    build: { context: ., target: worker }
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    <<: *app-env
    profiles: [app]
    image: ${AGENTLY_IMAGES:-ghcr.io/sharifsumon/aichatbot}-web:${AGENTLY_TAG:-latest}
    build: { context: ., target: web }
    ports: ["127.0.0.1:${WEB_HOST_PORT:-3000}:3000"]

  admin:
    <<: *app-env
    profiles: [app]
    image: ${AGENTLY_IMAGES:-ghcr.io/sharifsumon/aichatbot}-admin:${AGENTLY_TAG:-latest}
    build: { context: ., target: admin }
    ports: ["127.0.0.1:${ADMIN_HOST_PORT:-3001}:3001"]

  # HTTPS for all three domains; Meta only sends webhooks to HTTPS URLs.
  # Leave it out (COMPOSE_PROFILES=app) when another web server already has ports 80 and 443.
  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [api, web, admin]
    restart: unless-stopped

volumes:
  postgres:
  redis:
  caddy:
